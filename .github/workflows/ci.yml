name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    env:
      # Valores ficticios: `prisma generate` y los tests no se conectan a la BD.
      DATABASE_URL: postgresql://user:password@localhost:5432/galiedu
      DIRECT_URL: postgresql://user:password@localhost:5432/galiedu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
